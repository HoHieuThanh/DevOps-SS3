<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #333;
            text-align: center;
        }

        .error-page {
            max-width: 600px;
            padding: 40px;
        }

        .error-code {
            margin: 0;
            font-size: 96px;
            font-weight: bold;
            color: #d9534f;
        }

        h1 {
            margin: 10px 0;
            font-size: 32px;
        }

        p {
            font-size: 18px;
            color: #666;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #337ab7;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        a:hover {
            background: #286090;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <p class="error-code">404</p>
        <h1>Không tìm thấy trang</h1>
        <p>
            Xin lỗi, đường dẫn bạn đang truy cập không tồn tại
            hoặc đã được thay đổi.
        </p>
        <a href="/">Quay về trang chủ</a>
    </div>
</body>
</html>
